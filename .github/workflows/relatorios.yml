name: Relatorios Log de Coberturas (PDF -> OneDrive)

on:
  schedule:
    - cron: '50 2 * * *'    # 23:50 de Brasilia (fim do dia)
    - cron: '0 4 1 * *'     # 01:00 de Brasilia do dia 1 (fecha o mes anterior)
    - cron: '0 11,17,23 * * *'  # revisao de dias editados (08h, 14h e 20h de Brasilia)
  workflow_dispatch:
    inputs:
      modo:
        description: 'dia, mes ou revisao'
        required: true
        default: 'dia'
        type: choice
        options: [dia, mes, revisao]
      data:
        description: 'Data especifica para teste (AAAA-MM-DD ou AAAA-MM). Vazio = hoje'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    env:
      MS_TENANT_ID:     ${{ secrets.MS_TENANT_ID }}
      MS_CLIENT_ID:     ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
      RELAY_URL:        ${{ secrets.RELAY_URL }}
      RELAY_TOKEN:      ${{ secrets.RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: |
          npm init -y
          npm install puppeteer@23 --no-audit --no-fund

      - name: Definir modo (dia ou mes)
        id: modo
        run: |
          if [ "${{ github.event.schedule }}" = "0 4 1 * *" ]; then
            echo "valor=mes" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 11,17,23 * * *" ]; then
            echo "valor=revisao" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.modo }}" ]; then
            echo "valor=${{ github.event.inputs.modo }}" >> "$GITHUB_OUTPUT"
          else
            echo "valor=dia" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar o PDF direto do site
        if: ${{ steps.modo.outputs.valor != 'revisao' }}
        env:
          SITE_URL: https://lucasbitto.github.io/LogCoberturas/
          DATA_ALVO: ${{ github.event.inputs.data }}
        run: node scripts/gerar-pdf.js ${{ steps.modo.outputs.valor }}

      - name: Revisar dias editados e refazer os PDFs
        if: ${{ steps.modo.outputs.valor == 'revisao' }}
        env:
          SITE_URL: https://lucasbitto.github.io/LogCoberturas/
          DIAS_REVISAO: '30'
          RELAY_URL:   ${{ secrets.RELAY_URL }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: node scripts/revisar-dias.js

      - name: Guardar o historico da revisao
        if: ${{ steps.modo.outputs.valor == 'revisao' }}
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain scripts/estado-pdfs.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/estado-pdfs.json
            git commit -m "Revisao de PDFs: atualiza historico"
            # traz o que mudou no repositorio antes de enviar (evita push rejeitado)
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "tentativa $i falhou; repetindo..."
              sleep 5
            done
          else
            echo "Nada mudou no historico."
          fi

      - name: Guardar copia do PDF no GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-${{ steps.modo.outputs.valor }}
          path: scripts/saida/*.pdf
          if-no-files-found: warn
          retention-days: 90

      # So tenta o OneDrive se os segredos ja estiverem cadastrados.
      - name: Entregar o PDF (ponte por e-mail)
        if: ${{ env.RELAY_URL != '' && steps.modo.outputs.valor != 'revisao' }}
        run: node scripts/enviar-email.js

      # Marca o dia como ja gerado, para a revisao nao refazer sem necessidade
      - name: Registrar no historico
        if: ${{ steps.modo.outputs.valor == 'dia' }}
        continue-on-error: true
        env:
          SITE_URL: https://lucasbitto.github.io/LogCoberturas/
          MARCAR_SEM_GERAR: '1'
          DIAS_REVISAO: '2'
        run: |
          node scripts/revisar-dias.js 2
          if [ -n "$(git status --porcelain scripts/estado-pdfs.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/estado-pdfs.json
            git commit -m "Registra PDF do dia no historico"
            git pull --rebase --autostash || true
            git push
          fi

      # Caminho direto, usado apenas se um dia a TI liberar o registro no Azure.
      - name: Enviar para o OneDrive
        if: ${{ env.MS_CLIENT_ID != '' && env.MS_REFRESH_TOKEN != '' }}
        run: node scripts/enviar-onedrive.js

      - name: Aviso (nenhuma entrega configurada)
        if: ${{ env.RELAY_URL == '' && env.MS_CLIENT_ID == '' }}
        run: echo "PDF gerado com sucesso, mas nenhuma entrega esta configurada. Cadastre RELAY_URL e RELAY_TOKEN em Settings > Secrets and variables > Actions. O PDF continua disponivel nos artefatos desta execucao." 
